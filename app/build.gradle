apply plugin: 'com.android.application'

android {
    namespace 'com.android.proot.sample'
    compileSdk 34

    defaultConfig {
        applicationId "com.android.proot.sample"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file('proot.keystore')
            storePassword 'proot123'
            keyAlias 'proot'
            keyPassword 'proot123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            packagingOptions {
                jniLibs {
                    useLegacyPackaging = true
                }
            }
        }
        debug {
            signingConfig signingConfigs.release
            packagingOptions {
                jniLibs {
                    useLegacyPackaging = true
                }
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.annotation:annotation:1.7.0'
}
